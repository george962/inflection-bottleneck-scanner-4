name: Legacy Discovery Only
on:
  workflow_dispatch:
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: inflection-scanner discover --deep 60 --top 30
