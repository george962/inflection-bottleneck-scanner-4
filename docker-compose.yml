services:
  research:
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./published:/app/published
      - ./config:/app/config:ro
    command: ["inflection-scanner", "research", "--deep", "180", "--research-count", "20", "--top", "30"]

  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./published:/app/published:ro
    command:
      [
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501"
      ]
